steps:
  test:
    image: rust:1.76-slim
    commands:
      - apt-get update && apt-get install -y pkg-config libssl-dev
      - cargo test --workspace

  build_linux:
    image: rust:1.76-slim
    commands:
      - apt-get update && apt-get install -y pkg-config libssl-dev
      - cargo build --release

  # [NEW] CI Step: Package the binary into a Docker Image and push it to GitHub Container Registry
  publish_image:
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    settings:
      repo: ghcr.io/YOUR_GITHUB_USERNAME/anchor-app # Replace with your GitHub Username
      tags: latest
      registry: ghcr.io
      # We will need to save docker_username and docker_password securely in Woodpecker's UI later
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password

  # [NEW] CD Step: Tell the UAT Kubernetes server to update to the new image
  deploy_uat:
    image: bitnami/kubectl:latest
    # Because Woodpecker runs ON the manager server, we can securely mount the internal Kubeconfig!
    volumes:
      - /etc/rancher/k3s/k3s.yaml:/kubeconfig.yaml:ro
    environment:
      KUBECONFIG: /kubeconfig.yaml
    commands:
      - kubectl rollout restart deployment/anchor-app -n buildwithruud-uat

  # ===================================================================
  # [NEW] NOTIFICATIONS
  # All secrets listed below (e.g. discord_webhook_id) are securely 
  # added via the Woodpecker Web UI and are NEVER stored in git.
  # ===================================================================

  notify_discord:
    image: appleboy/drone-discord
    settings:
      webhook_id:
        from_secret: discord_webhook_id
      webhook_token:
        from_secret: discord_webhook_token
      message: >
        **{{repo.owner}}/{{repo.name}} CI/CD Update**
        {{#success build.status}}
          ✅ Build #{{build.number}} successfully passed tests and was deployed!
          🚀 **Deployed URL:** https://uat.anchor.buildwithruud.com
        {{else}}
          ❌ Build #{{build.number}} failed at step `{{build.failed_steps}}`.
          Fix required before deployment permitted.
        {{/success}}
        *Pipeline Logs:* {{build.link}}
  notify_telegram:
    image: appleboy/drone-telegram
    settings:
      token:
        from_secret: telegram_token
      to:
        from_secret: telegram_chat_id
      message: >
        📦 <b>{{repo.owner}}/{{repo.name}}</b> Update
        {{#success build.status}}
        ✅ Build #{{build.number}} deployed successfully.
        🚀 <b>URL:</b> https://uat.anchor.buildwithruud.com
        {{else}}
        ❌ Build #{{build.number}} failed at step {{build.failed_steps}}.
        {{/success}}
        🔍 <a href="{{build.link}}">View Pipeline Logs</a>
  notify_email:
    image: drillster/drone-email
    settings:
      host: smtp.protonmail.ch
      port: 587
      from: alerts@oply.co
      username:
        from_secret: smtp_username
      password:
        from_secret: smtp_password
      recipients:
        - admin@oply.co
      subject: "[{{build.status}}] Deployment for {{repo.name}}"
      body: >
        Project: {{repo.owner}}/{{repo.name}}
        Status: {{build.status}}
        Deployed URL: https://uat.anchor.buildwithruud.com
        Build Link: {{build.link}}
  notify_teams:
    image: jrollet/drone-teams
    settings:
      webhook:
        from_secret: teams_webhook_url
      title: "CI/CD Pipeline Update: {{repo.name}}"
      message: >
        **Status:** {{build.status}}
        **Deployed URL:** [UAT Environment](https://uat.anchor.buildwithruud.com)
        **Logs:** [View Logs Here]({{build.link}})
