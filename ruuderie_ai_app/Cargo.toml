# Define the workspace and its member crates
[workspace]
members = ["app", "backend", "entity", "migration"]
# Use the new dependency resolver to avoid conflicts
resolver = "2"

# Shared package information for all workspace members
[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ruud Salym Erie"]
description = "A Rust app built with Axum, Leptos, SeaORM, and more"
license = "MIT OR Apache-2.0"

# Release profile configuration for optimized builds
[profile.release]
codegen-units = 1 # Optimize for size rather than parallel codegen
lto = true        # Enable Link Time Optimization
opt-level = 'z'   # Optimize for size
strip = true      # Remove debug symbols

# Specific profile for WebAssembly releases
[profile.wasm-release]
inherits = "release"
opt-level = 'z'      # Optimize for size
lto = true           # Enable Link Time Optimization
codegen-units = 1    # Further optimize for size
panic = "abort"      # Remove stack unwinding on panic

# Development profile configuration
[profile.dev]
opt-level = 0

# High optimization for our dependencies in development
[profile.dev.package."*"]
opt-level = 3

# Shared dependencies for all workspace members
[workspace.dependencies]
dotenv = "0.15.0"
leptos_dom = "0.6.13"
leptos_axum = "0.6.13"
leptos_query = { version = "0.5.3", default-features = false }
serde = { version = "1.0.204", default-features = false }
serde_json = "1.0.113"
thiserror = "1.0.56"
time = { version = "0.3.36", features = ["wasm-bindgen"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
tracing-wasm = "0.2.1"
uuid = { version = "1.4.1", features = ["v4", "fast-rng", "macro-diagnostics"] }
bcrypt = "0.15.1"
rand = "0.8.5"

# Leptos workspace-specific configuration
[workspace.metadata.leptos]
name = "ruuderie-ai"
output-name = "ruuderie-ai"
# Package containing the library (client-side) code
lib-package = "app"
