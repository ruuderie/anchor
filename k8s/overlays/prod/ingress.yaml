apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ruuderie-app-ingress
  namespace: ruuderie-ai
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - ruuderie.com
    secretName: ruuderie-tls
  rules:
  - host: ruuderie.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ruuderie-app
            port:
              number: 80
