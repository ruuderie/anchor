apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ruuderie-app-ingress
  namespace: ruuderie-ai
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ruuderie-app
            port:
              number: 80
