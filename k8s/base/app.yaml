apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruuderie-app
  namespace: ruuderie-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruuderie-app
  template:
    metadata:
      labels:
        app: ruuderie-app
    spec:
      containers:
      - name: ruuderie-app
        image: ruuderie_ai-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: app-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: ruuderie-app
  namespace: ruuderie-ai
spec:
  selector:
    app: ruuderie-app
  ports:
  - port: 80
    targetPort: 3000
