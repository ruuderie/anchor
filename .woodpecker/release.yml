when:
  - event: [push, manual]

steps:
  test:
    image: rustlang/rust:nightly-bookworm
    commands:
      - apt-get update && apt-get install -y pkg-config libssl-dev
      - cargo test --workspace

  build_linux:
    image: rustlang/rust:nightly-bookworm
    commands:
      - apt-get update && apt-get install -y pkg-config libssl-dev
      - cargo build --release

  # [NEW] CI Step: Package the binary into a Docker Image and push it to GitHub Container Registry
  publish_image:
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    settings:
      repo: ghcr.io/ruuderie/anchor-app # Replace with your GitHub Username
      tags: latest
      registry: ghcr.io
      # We will need to save docker_username and docker_password securely in Woodpecker's UI later
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password

  # [NEW] CD Step: Tell the UAT Kubernetes server to update to the new image
  deploy_uat:
    image: bitnami/kubectl:latest
    # Because Woodpecker runs ON the manager server, we can securely mount the internal Kubeconfig!
    volumes:
      - /etc/rancher/k3s/k3s.yaml:/kubeconfig.yaml:ro
    environment:
      KUBECONFIG: /kubeconfig.yaml
    commands:
      - kubectl rollout restart deployment/anchor-app -n buildwithruud-uat

  # ===================================================================
  # [NEW] NOTIFICATIONS
  # All secrets listed below (e.g. discord_webhook_id) are securely
  # added via the Woodpecker Web UI and are NEVER stored in git.
  # ===================================================================

  # To activate notifications (Discord, Email, Telegram, Teams), securely inject
  # their Webhook tokens via your Woodpecker CI Dashboard Settings > Secrets tab.
  # View the Woodpecker Documentation for syntax details when ready.
