version: "3.9"
services:
  app:
    container_name: "ruuderie_app"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://ruud_admin:R3sUm3_S3cUr3@db:5432/ruuderie_ai
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - ruuderie_net

  db:
    container_name: "ruuderie_db"
    image: postgres:14-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=ruud_admin
      - POSTGRES_PASSWORD=R3sUm3_S3cUr3
      - POSTGRES_DB=ruuderie_ai
    ports:
      - "5432:5432"
    networks:
      - ruuderie_net

volumes:
  postgres-data:

networks:
  ruuderie_net:
